onboarding = false
[theme]
name = "dracula"
auto_switch = false

[ui]
# Share divider borders between splits instead of separated panes (tmux-style).
pane_gaps = false

# Minimum sidebar width when expanded (columns; default 18)
sidebar_min_width = 10

# Forward Option-right-click gestures to mouse-aware pane applications.
right_click_passthrough_modifier = "alt"

# Keep the tab row visible even with a single tab, so the zoom indicator below
# always has somewhere to render.
hide_tab_bar_when_single_tab = false

# tmux-style status area at the right edge of the tab row. The zoom entry shows
# a ZOOM pill while the active tab is zoomed, so a hidden pane is never a
# surprise (per-tab "Z" markers stay independent of this).
tab_bar_right = [{ type = "zoom" }]

# Keybindings translated from tmux (home.nix programs.tmux).
# Herdr defaults already cover: prefix ctrl+b, prefix+c new tab (new_cwd =
# "follow" replicates tmux's -c "#{pane_current_path}"), prefix+h/l pane
# focus, prefix+z zoom, prefix+[ copy mode with v/y selection, mouse support.
agent_panel_sort = "priority"
show_agent_labels_on_pane_borders = false
[keys]
# Switch workspaces directly with the standard macOS tab-navigation chords.
previous_workspace = ["cmd+shift+["]
next_workspace = ["cmd+shift+]"]

# Use Vim keys as aliases for workspace selection in navigate mode.
navigate_workspace_up = ["up", "k"]
navigate_workspace_down = ["down", "j"]

# tmux: bind '"' / bind % splits (herdr defaults kept as first binding)
split_horizontal = ["prefix+minus", "prefix+double_quote"]
# tmux also had ctrl+alt+5 as a direct horizontal-split chord
split_vertical = ["prefix+v", "prefix+percent", "ctrl+alt+5"]

# tmux: alt+minus / alt+= previous/next window
previous_tab = ["prefix+p", "alt+minus"]
next_tab = ["prefix+n", "alt+="]

# tmux: prefix+g opens the built-in goto picker.
goto = ["prefix+g"]

# tmux: prefix+t sesh session picker -> workspace picker
workspace_picker = ["prefix+w", "prefix+t"]

# tmux: prefix+z and bare F4 zoom. Bound below as shell commands so zooming can
# also stamp a marker on the pane border (see "zoom + border marker").

# tmux: prefix+ctrl+space cycled to next pane (the zoom half of that binding
# isn't composable in herdr; use prefix+z after)
cycle_pane_next = ["prefix+tab", "prefix+ctrl+space"]

# Keep direct Herdr pane navigation on prefixed and ctrl+alt chords. Bare
# ctrl+h/j/k/l is handled by herdr-navigator so Neovim splits get priority.
focus_pane_left = ["prefix+h", "ctrl+alt+h"]
focus_pane_down = ["prefix+j", "ctrl+alt+j"]
focus_pane_up = ["prefix+k", "ctrl+alt+k"]
focus_pane_right = ["prefix+l", "ctrl+alt+l"]

[[keys.command]]
key = "ctrl+h"
type = "plugin_action"
command = "willfish.herdr-navigator.left"
description = "navigate left"

[[keys.command]]
key = "ctrl+j"
type = "plugin_action"
command = "willfish.herdr-navigator.down"
description = "navigate down"

[[keys.command]]
key = "ctrl+k"
type = "plugin_action"
command = "willfish.herdr-navigator.up"
description = "navigate up"

[[keys.command]]
key = "ctrl+l"
type = "plugin_action"
command = "willfish.herdr-navigator.right"
description = "navigate right"

# Forward ctrl+h/j/k/l directly after pressing the prefix.
[[keys.command]]
key = "prefix+ctrl+h"
type = "shell"
command = 'herdr pane send-keys "$HERDR_ACTIVE_PANE_ID" ctrl+h'
description = "send ctrl+h to pane"

[[keys.command]]
key = "prefix+ctrl+j"
type = "shell"
command = 'herdr pane send-keys "$HERDR_ACTIVE_PANE_ID" ctrl+j'
description = "send ctrl+j to pane"

[[keys.command]]
key = "prefix+ctrl+k"
type = "shell"
command = 'herdr pane send-keys "$HERDR_ACTIVE_PANE_ID" ctrl+k'
description = "send ctrl+k to pane"

[[keys.command]]
key = "prefix+ctrl+l"
type = "shell"
command = 'herdr pane send-keys "$HERDR_ACTIVE_PANE_ID" ctrl+l'
description = "send ctrl+l to pane"

# Zoom + border marker. Herdr has no zoom-conditional colour, so instead of
# recolouring the ring we write into it: toggle zoom, then name the panes
# "<ZOOM MARKER> N HIDDEN" so the border itself says a pane is hidden. Every pane
# in the tab is marked, not just the zoomed one, because focusing a neighbour
# while zoomed keeps zoom on and swaps which pane fills the tab. Unzoom clears
# them all. A pane you named yourself is left alone.
[[keys.command]]
key = "prefix+z"
type = "shell"
description = "zoom (marks the pane border)"
command = '''
zoomed=$(herdr pane zoom "$HERDR_ACTIVE_PANE_ID" | jq -r '.result.zoom.zoomed')
panes=$(herdr pane list | jq -c --arg t "$HERDR_ACTIVE_TAB_ID" '[.result.panes[] | select(.tab_id == $t)]')
mark="⛶ ZOOMED · $(printf '%s' "$panes" | jq -r 'length - 1') HIDDEN"
if [ "$zoomed" = true ]; then
  printf '%s' "$panes" |
    jq -r '.[] | select((.label // "") == "" or ((.label // "") | startswith("⛶ ZOOMED"))) | .pane_id' |
    while read -r pane; do herdr pane rename "$pane" "$mark"; done
else
  printf '%s' "$panes" |
    jq -r '.[] | select((.label // "") | startswith("⛶ ZOOMED")) | .pane_id' |
    while read -r pane; do herdr pane rename "$pane" --clear; done
fi
exit 0
'''

[[keys.command]]
key = "f4"
type = "shell"
description = "zoom (marks the pane border)"
command = '''
zoomed=$(herdr pane zoom "$HERDR_ACTIVE_PANE_ID" | jq -r '.result.zoom.zoomed')
panes=$(herdr pane list | jq -c --arg t "$HERDR_ACTIVE_TAB_ID" '[.result.panes[] | select(.tab_id == $t)]')
mark="⛶ ZOOMED · $(printf '%s' "$panes" | jq -r 'length - 1') HIDDEN"
if [ "$zoomed" = true ]; then
  printf '%s' "$panes" |
    jq -r '.[] | select((.label // "") == "" or ((.label // "") | startswith("⛶ ZOOMED"))) | .pane_id' |
    while read -r pane; do herdr pane rename "$pane" "$mark"; done
else
  printf '%s' "$panes" |
    jq -r '.[] | select((.label // "") | startswith("⛶ ZOOMED")) | .pane_id' |
    while read -r pane; do herdr pane rename "$pane" --clear; done
fi
exit 0
'''

# F1: fuzzy MRU Space selector from Herdr Recent Navigator.
[[keys.command]]
key = "f1"
type = "plugin_action"
command = "beyondlex.herdr-recent-navigator.focus-workspaces"
description = "open Space navigator"

# F2: mouse-enabled command bar for tabs, agents, workspaces, repos, and branches.
[[keys.command]]
key = "f2"
type = "plugin_action"
command = "herdr-bar.open"
description = "open Herdr Bar"

# F3: Recent Navigator focused directly on its Agents (@) page.
[[keys.command]]
key = "f3"
type = "plugin_action"
command = "beyondlex.herdr-recent-navigator.focus-agents"
description = "open Agents navigator"

# tmux: prefix ctrl+u — fzf-pick URLs from scrollback and open them
[[keys.command]]
key = "prefix+ctrl+u"
type = "popup"
command = 'herdr pane read "$HERDR_ACTIVE_PANE_ID" --source recent-unwrapped --lines 2000 | grep -oE "(https?)://[^ ]*" | sort -u | fzf --multi --bind alt-a:select-all,alt-d:deselect-all | xargs open'
description = "open URLs from scrollback"
height = "50%"

# tmux: bind ! break-pane -d -n _hidden_pane
[[keys.command]]
key = "prefix+!"
type = "shell"
command = 'herdr pane move "$HERDR_ACTIVE_PANE_ID" --new-tab --label _hidden_pane --no-focus'
description = "break pane to hidden tab"

# tmux: bind @ join-pane (bring the hidden pane back into this tab)
[[keys.command]]
key = "prefix+@"
type = "shell"
command = "tab=$(herdr tab list | jq -r --arg ws \"$HERDR_ACTIVE_WORKSPACE_ID\" '.result.tabs[] | select(.workspace_id==$ws and .label==\"_hidden_pane\") | .tab_id' | head -n1); pane=$(herdr pane list | jq -r --arg t \"$tab\" '.result.panes[] | select(.tab_id==$t) | .pane_id' | head -n1); [ -n \"$pane\" ] && herdr pane move \"$pane\" --tab \"$HERDR_ACTIVE_TAB_ID\" --split right --focus"
description = "join hidden pane back"

# tmux: bind < / > swap-window -1/+1 (also covered S-F1/S-F2, C-M-PageUp/Down)
[[keys.command]]
key = "prefix+<"
type = "shell"
command = "i=$(herdr tab list --workspace \"$HERDR_ACTIVE_WORKSPACE_ID\" | jq -r --arg t \"$HERDR_ACTIVE_TAB_ID\" '.result.tabs | to_entries[] | select(.value.tab_id==$t) | .key'); [ \"$i\" -gt 0 ] && printf '{\"id\":\"mv\",\"method\":\"tab.move\",\"params\":{\"tab_id\":\"%s\",\"insert_index\":%d}}\\n' \"$HERDR_ACTIVE_TAB_ID\" $((i-1)) | nc -U -w 2 \"$HERDR_SOCKET_PATH\""
description = "move tab left"

[[keys.command]]
key = "prefix+>"
type = "shell"
command = "out=$(herdr tab list --workspace \"$HERDR_ACTIVE_WORKSPACE_ID\"); i=$(printf '%s' \"$out\" | jq -r --arg t \"$HERDR_ACTIVE_TAB_ID\" '.result.tabs | to_entries[] | select(.value.tab_id==$t) | .key'); c=$(printf '%s' \"$out\" | jq -r '.result.tabs | length'); [ \"$i\" -lt $((c-1)) ] && printf '{\"id\":\"mv\",\"method\":\"tab.move\",\"params\":{\"tab_id\":\"%s\",\"insert_index\":%d}}\\n' \"$HERDR_ACTIVE_TAB_ID\" $((i+2)) | nc -U -w 2 \"$HERDR_SOCKET_PATH\""
description = "move tab right"

[ui.toast]
delivery = "system"

[ui.sound]
enabled = false
